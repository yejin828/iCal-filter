<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCalendar フィルター</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9ff;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .upload-subtext {
            color: #999;
            font-size: 13px;
        }
        .file-input {
            display: none;
        }
        .file-info {
            background: #f0f2ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .file-info.show {
            display: flex;
        }
        .file-name {
            flex: 1;
            color: #333;
            font-weight: 500;
            word-break: break-all;
        }
        .file-remove {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .file-remove:hover {
            background: #ff3838;
        }
        .date-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="date"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .button:active {
            transform: translateY(0);
        }
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            .date-inputs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 iCalendar フィルター</h1>
        <p class="subtitle">指定した期間のイベントのみを抽出します</p>
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">icsファイルをドラッグ&ドロップ</div>
            <div class="upload-subtext">またはクリックしてファイルを選択</div>
            <input type="file" id="fileInput" class="file-input" accept=".ics">
        </div>
        <div class="file-info" id="fileInfo">
            <span class="file-name" id="fileName"></span>
            <button class="file-remove" id="fileRemove">✕ 削除</button>
        </div>
        <div class="date-inputs">
            <div class="input-group">
                <label for="startDate">開始日</label>
                <input type="date" id="startDate">
            </div>
            <div class="input-group">
                <label for="endDate">終了日</label>
                <input type="date" id="endDate">
            </div>
        </div>
        <button class="button" id="filterButton" disabled>フィルタリング実行</button>
        <div class="status" id="status"></div>
    </div>
    <script>
        let uploadedFile = null;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileRemove = document.getElementById('fileRemove');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        const filterButton = document.getElementById('filterButton');
        const status = document.getElementById('status');

        const today = new Date();
        const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        startDateInput.valueAsDate = firstDay;
        endDateInput.valueAsDate = lastDay;

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });
        fileRemove.addEventListener('click', () => {
            uploadedFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            filterButton.disabled = true;
            hideStatus();
        });

        function handleFile(file) {
            if (!file.name.endsWith('.ics')) {
                showStatus('error', 'icsファイルを選択してください');
                return;
            }
            uploadedFile = file;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            filterButton.disabled = false;
            hideStatus();
        }

        filterButton.addEventListener('click', async () => {
            if (!uploadedFile) return;
            const startDate = new Date(startDateInput.value);
            const endDate = new Date(endDateInput.value);
            if (startDate > endDate) {
                showStatus('error', '開始日は終了日より前に設定してください');
                return;
            }
            try {
                showStatus('info', '処理中...');
                const text = await uploadedFile.text();
                const filteredIcs = filterIcsFile(text, startDate, endDate);
                downloadFile(filteredIcs, `filtered_${uploadedFile.name}`);
                showStatus('success', 'フィルタリングが完了しました！');
            } catch (error) {
                showStatus('error', `エラー: ${error.message}`);
            }
        });

        function filterIcsFile(icsContent, startDate, endDate) {
            const lines = icsContent.split(/\r?\n/);
            const filteredLines = [];
            let inEvent = false;
            let currentEvent = [];
            let eventStart = null;
            let eventEnd = null;
            const endDateTime = new Date(endDate);
            endDateTime.setHours(23, 59, 59, 999);

            for (let line of lines) {
                if (line.startsWith('BEGIN:VEVENT')) {
                    inEvent = true;
                    currentEvent = [line];
                    eventStart = eventEnd = null;
                } else if (line.startsWith('END:VEVENT')) {
                    currentEvent.push(line);
                    if (eventStart && eventEnd) {
                        const start = parseIcsDate(eventStart);
                        const end = parseIcsDate(eventEnd);
                        if (start <= endDateTime && end >= startDate) {
                            filteredLines.push(...currentEvent);
                        }
                    }
                    inEvent = false;
                } else if (inEvent) {
                    currentEvent.push(line);
                    if (line.startsWith('DTSTART')) eventStart = line.split(':')[1];
                    else if (line.startsWith('DTEND')) eventEnd = line.split(':')[1];
                } else {
                    filteredLines.push(line);
                }
            }
            return filteredLines.join('\r\n');
        }

        function parseIcsDate(dateStr) {
            dateStr = dateStr.replace(/[;:].*/g, '');
            const year = parseInt(dateStr.substring(0, 4));
            const month = parseInt(dateStr.substring(4, 6)) - 1;
            const day = parseInt(dateStr.substring(6, 8));
            if (dateStr.length >= 15) {
                const hour = parseInt(dateStr.substring(9, 11));
                const minute = parseInt(dateStr.substring(11, 13));
                const second = parseInt(dateStr.substring(13, 15));
                return new Date(year, month, day, hour, minute, second);
            }
            return new Date(year, month, day);
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showStatus(type, message) {
            status.textContent = message;
            status.className = `status show ${type}`;
        }
        function hideStatus() {
            status.classList.remove('show');
        }
    </script>
</body>
</html>
